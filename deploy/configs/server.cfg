/////////////////////////////////////////////////////////
// Arma 3 Server Configuration
// For "Tactique Airsoft" mission
// Comments in English
/////////////////////////////////////////////////////////

// -------------------------
// GLOBAL SETTINGS
// -------------------------
hostname = "Tactique Airsoft | 7vs7";  // Server name
password = "";                          // Server password (empty = public)
passwordAdmin = "$ADMIN_PASSWORD";      // Admin password
verifySignatures = 2;                   // 2 = verify signed PBOs
equalModRequired = 0;                   // Don't require all mods to match
BattlEye = 0;                           // 0 = disable BattlEye (anti-cheat)

// -------------------------
// WELCOME MESSAGE (MOTD)
// -------------------------
motd[] = {
    "Tactique Airsoft",
    "La MOTA welcomes you!"
};
motdInterval = 10;  // Interval in seconds between messages

// -------------------------
// JOINING RULES
// -------------------------
maxPlayers = 14;           // Max players on server
voteMissionPlayers = 1;    // Minimum players to enable mission vote
voteThreshold = 0.33;      // 33% of players must vote to pass

// -------------------------
// IN-GAME SETTINGS
// -------------------------
disableVoN = 0;           // Voice over Net enabled
vonCodecQuality = 5;      // VoN quality 1-10

// -------------------------
// MOD / SCRIPT ISSUES
// -------------------------
kickDuplicate = 1;        // Kick duplicate Steam IDs
onUnsignedData = "kick (_this select 0)";  // Kick if unsigned PBO detected
onHackedData = "kick (_this select 0)";    // Kick if hacked data detected
onDifferentData = "kick (_this select 0)"; // Kick if mismatched data

// -------------------------
// STEAM SETTINGS
// -------------------------
steamPort = 9566;         // Steam port for the server
steamQueryPort = 27816;   // Steam query port

// -------------------------
// ALLOWED FILE EXTENSIONS
// -------------------------
allowedLoadFileExtensions[] = {"hpp","sqs","sqf","fsm","cpp","paa","txt","xml","inc","ext","sqm","ods","fxy","lip","csv","kb","bik","bikb","html","htm","biedi","pbo","json"};
allowedPreprocessFileExtensions[] = {"hpp","sqs","sqf","fsm","cpp","paa","txt","xml","inc","ext","sqm","ods","fxy","lip","csv","kb","bik","bikb","html","htm","biedi","pbo"};
allowedHTMLLoadExtensions[] = {"htm","html","xml","txt"};

// -------------------------
// MISSIONS / AUTO-RESTART
// -------------------------
autoInit = 1;           // Automatically start mission after previous ends (even if no players)
persistent = 1;         // 0 = mission resets when last player leaves

class Missions
{
    class Arma
    {
        template = Airsotf.Altis;     // Mission PBO name
        difficulty = "Veteran";       // Difficulty setting
    };
};
